name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Mypy Typecheck
        run: uv run mypy agent/config.py agent/models.py agent/session_state.py agent/evaluator.py agent/llm_provider.py agent/main.py rag/models.py rag/ingest.py rag/vectorstore.py rag/retriever.py tests/test_cards.py tests/test_config.py tests/test_evaluator.py tests/test_retriever.py tests/test_session_state.py

      - name: Run Pytest
        env:
          GROQ_API_KEY: "mock-key-for-tests"
          LIVEKIT_URL: "wss://mock.livekit.cloud"
          LIVEKIT_API_KEY: "mock-key"
          LIVEKIT_API_SECRET: "mock-secret"
        run: uv run pytest

  frontend-build:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Build Next.js Bundle
        env:
          LIVEKIT_URL: "wss://mock.livekit.cloud"
          LIVEKIT_API_KEY: "mock-key"
          LIVEKIT_API_SECRET: "mock-secret"
        run: npm run build
