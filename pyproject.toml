[project]
name = "interview-pilot"
version = "0.1.0"
description = "Real-time voice interview coach with RAG rubric retrieval and structured LLM evaluation powered by Groq and local embeddings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "InterviewPilot Contributors" }
]
keywords = ["livekit", "interview", "ai", "voice", "rag", "groq", "evaluations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # LiveKit Voice Agent
    "livekit-agents>=0.12.0",
    "livekit-plugins-groq>=0.1.0",
    "livekit-plugins-silero>=0.7.0",
    "typer>=0.9.0",
    
    # Groq & Local Embeddings
    "groq>=0.9.0",
    "sentence-transformers>=2.2.0",
    "langchain-huggingface>=0.0.1",
    
    # RAG Pipeline
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    
    # Configuration & Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
interview-pilot = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
